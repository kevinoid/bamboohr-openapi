openapi: '3.0.2'

# API metadata
info:
  title: BambooHR API
  version: 1.0.0
  description: >-
    BambooHR provides companies a human capital management software as a
    service.
  contact:
    name: BambooHR
    email: support@bamboohr.com
    url: https://www.bamboohr.com/contact.php
    x-twitter: bamboohr
  termsOfService: https://www.bamboohr.com/terms-of-service/
  license:
    name: BambooHR API Terms of Use
    url: https://partners.bamboohr.com/bamboohr-api-terms-of-use/

  # APIs.guru Extensions
  # https://github.com/APIs-guru/openapi-directory/wiki/specification-extensions
  x-apiClientRegistration: https://www.bamboohr.com/signup/
  x-apisguru-categories:
  - enterprise
  x-description-language: en
  # More logos at https://www.bamboohr.com/about/press.php#mediaAssets
  x-logo:
    backgroundColor: '#FFFFFF'
    url: https://www.bamboohr.com/img/new-press-images/bamboohr-green-png.png
  x-unofficialSpec: true

externalDocs:
  description: BambooHR API Documentation
  url: https://documentation.bamboohr.com/docs

servers:
- url: https://api.bamboohr.com/api/gateway.php/{subdomain}
  variables:
    subdomain:
      default: mycompany
      description: >-
        The subdomain used to access your account (If you access BambooHR at
        https://mycompany.bamboohr.com, then the subdomain is "mycompany")

security:
- apiKey: []

tags:
- name: Benefits
  description: >-
    There are two primary entities when dealing with benefits: Benefit Plans
    and Benefit Groups.


    Benefit Plans define the Type (medical, dental, etc.), Coverage options
    (employee, employee + spouse, etc.), and Total Monthly Costs (i.e. the
    premium). Each plan will also show when it went into effect and when it is
    set to expire. Plans must be configured before you can create Benefit
    Groups.


    Benefit Groups allow you to create a customizable benefit package for
    specific employee groupings. For example, you may want to have a Benefit
    Group for all of your full time employees for which you include a Medical,
    Dental, Vision, and 401K plan. You could then have a separate Benefit Group
    for your part time employees which allows for Medical only. Plan
    eligibility rules and group-specific employee pays and company pays amounts
    are set in benefit groups (with the exception of plans where pays
    information is set at the employee level).

    In addition to getting benefit information through the API, you can also
    get employee deductions for a given plan and define the dependents
    associated with your employees. You cannot currently enroll employees or
    change benefit status through the API.
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/benefits.php
- name: Changes
  description: >-
    The Last Changed API allows you to discover which employees have been
    recently added, changed, or deleted. Any change to any field inside an
    employee record will count as an update. Insert events are only recorded
    when an employee record is first created. Delete events are only recorded
    when an employee record is deleted.


    **Note:** Last change timestamps are a newer feature in BambooHR. We
    started recording these dates on June 5th, 2011. We do not have last
    changed data for any changes that occurred before this date.
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/changes.php
- name: Employees
  description: >-
    Operations for adding and retrieving employee information, and associated
    files.
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/employees.php
- name: Login
  description: >-
    Access control to the API is always controlled by an API key that
    identifies a particular user. Usually, this API key is generated on the
    website and then copied into your third party application. It is now
    possible for registered applications to generate new API keys for each user
    on the fly by making a special API request.

    **Note:** Each application using this approach is required to provide an
    application key to identify what application is requesting the API key. For
    more information on obtaining application keys please contact
    support@bamboohr.com.

    **Note:** If you already have an API key, you do not need to use the Login
    API.
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/login.php
- name: Metadata
  description: >-
    The Metadata API allows you to retrieve "data about data" for a given
    BambooHR account. You can determine what fields a customer is using. You
    can determine what options are available in a list. You can determine what
    users are able to access the system.

    Metadata is important because BambooHR is highly configurable. A given
    customer's account may have drastically different settings from another
    customer. Using this API, you can determine what values the account
    supports.

    Read only access to metadata does not require any special permissions. When
    write access to metadata is supported then the user will need the
    appropriate permissions to create new users, for example.
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/metadata.php
- name: Payroll
  description: >-
    There are four primary entities used in building the BambooHR paystub
    experience:

    - Raw paystub data
    - Pay period dates (past, current, and future)
    - Direct deposit settings
    - Tax withholding settings

    All of the information displayed as part of the paystub experience is
    read-only, although employees may navigate through paystub history, view
    specific paystub details, and then download or print the paystub.

    Raw paystub data (income, withholdings, deductions, etc.) and pay period
    data (past, present, and future) are required to generate the primary
    paystub experience in BambooHR. Direct deposit and tax withholding data
    completes the experience for the employee, but is not critical. If no
    direct deposit or tax withholding data are provided, those portions of the
    experience will not be displayed to the employee user.
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/payroll.php
- name: Photos
  description: >-
    The Photos API allows you to retrieve employee photos. There is a standard
    API-based mechanism for retrieving the photo binary data.
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/photos.php
- name: Tables
  description: >-
    Some data in the BambooHR system is stored as a two dimensional grid for
    each employee. The tables API allows you to grab tabular data for the
    various tables in BambooHR. For standard tables, a series of fields will be
    outlined below. API support for custom tables will be added in a future
    release.
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/tables.php
- name: TimeOff
  description: >-
    There are two primary entities when dealing with time off. The requests and
    the history.

    Requests represent a request from an employee to take time off. A request
    needs to be approved before it will be recorded into the history. A user
    with sufficient permissions can create a request and mark it approved at
    the same time.

    The history is log of all events that effect an employee's balance. The
    current balance of time off is the sum of all events in the history. Time
    off used decreases the total, while time off accruals increase it.
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/time_off.php
- name: TimeTracking
  description: >-
    The time tracking API is used to send approved hours worked to BambooHR,
    similar to how you would send hours to a payroll company. These hours are
    stored in BambooHR and can be used to accrue paid time off using BambooHR’s
    accrual feature, and/or sent to a BambooHR payroll partner during the
    payroll run. This makes it possible for the customer to use BambooHR as the
    source of all payroll related data.

    Time records can be added to BambooHR or can be retrieved from BambooHR.
    When adding time records to BambooHR, certain fields are required with each
    entry such as a date, associated pay rate, and a rate type (see
    documentation below). Identifying information for the employee is also
    required so the hours may be associated with the proper employee in
    BambooHR. Lists of employees and their accompanying identifying information
    can be retrieved through our api (see Single Dimensional Data).

    Please note that only approved hours should be sent to BambooHR since there
    will be no distinction of approved or not-approved in BambooHR. If
    non-approved hours are sent to BambooHR, accruals may occur on those hours
    and they also may be passed to payroll. Edits to approved hours (additions
    or subtractions) should be sent as new records with their associated date
    (the date of the hours worked).
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/time_tracking.php

components:
  securitySchemes:
    apiKey:
      description: >-
        Requests to the BambooHR API are authenticated by sending an "API Key"
        for the user to be authenticated as the HTTP Basic username.  The
        password is ignored, but is commonly shown as "x" in the documentation.


        See https://documentation.bamboohr.com/docs#section-authentication
      type: http
      scheme: basic

  parameters:
    benefitCoverageId:
      name: id
      in: path
      description: Benefit Coverage ID
      required: true
      schema:
        type: integer
        minimum: 1
    benefitGroupEmployeeId:
      name: id
      in: path
      description: Benefit Group Employee ID
      required: true
      schema:
        type: integer
        minimum: 1
    benefitGroupId:
      name: id
      in: path
      description: Benefit Group ID
      required: true
      schema:
        type: integer
        minimum: 1
    benefitGroupPlanCostId:
      name: id
      in: path
      description: Benefit Group Plan Cost ID
      required: true
      schema:
        type: integer
        minimum: 1
    benefitGroupPlanId:
      name: id
      in: path
      description: Benefit Group Plan ID
      required: true
      schema:
        type: integer
        minimum: 1
    benefitPlanCoverageId:
      name: id
      in: path
      description: Benefit Plan Coverage ID
      required: true
      schema:
        type: integer
        minimum: 1
    benefitPlanId:
      name: id
      in: path
      description: Benefit Plan ID
      required: true
      schema:
        type: integer
        minimum: 1
    changeType:
      name: type
      in: query
      description: Limit changes to a given type
      schema:
        $ref: '#/components/schemas/ChangeType'
    companyFileId:
      name: fileId
      in: path
      description: ID of a company file
      required: true
      schema:
        type: integer
        minimum: 1
    dependentId:
      name: id
      in: path
      description: Dependent ID
      required: true
      schema:
        type: integer
        minimum: 1
    employeeFields:
      name: fields
      in: query
      description: >-
        Employee fields to return in the response.

        Note: The id field is always returned.
      # Note: the parameter is technically not required (getEmployee would
      # return just the id or 404), but it would make the generated API easy to
      # misuse.  Since the same response results from an empty array, make this
      # property required to reduce misuse.
      required: true
      explode: false
      schema:
        type: array
        items:
          type: string
    employeeFileId:
      name: fileId
      in: path
      description: ID of an employee file
      required: true
      schema:
        type: integer
        minimum: 1
    employeeId:
      name: id
      in: path
      description: Employee ID
      required: true
      schema:
        type: integer
        minimum: 1
    employeeIdFilter:
      name: employeeid
      in: query
      description: Limit response to a given Employee ID
      schema:
        type: integer
        minimum: 1
    endDate:
      name: end
      in: query
      description: End date of (inclusive) date range to include
      required: true
      schema:
        type: string
        format: date
    fieldId:
      name: id
      in: path
      description: Field ID to update
      required: true
      schema:
        type: integer
        minimum: 1
    filterDuplicates:
      name: fd
      in: query
      description: Apply standard duplicate field filtering?  Default yes
      schema:
        $ref: '#/components/schemas/YesNo'
    hashedEmail:
      name: h
      in: query
      description: >-
        The hash of the employee's work email. If they don't have a work email
        then the hash of the home email will work. If they do have a work email
        then the home email will not work.


        The email address must be representable in ASCII.


        The hash is computed as the following md5(strtolower(trim($email))),
        where the trim() function eliminates ASCII whitespace, the strtolower()
        function converts ASCII text to lowercase and the md5 function produces
        a hex string representing the MD5 hash of the data. In PHP you can use
        these exact functions, in other languages there will be equivalent
        functions you can use.
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$'
    photoSize:
      name: size
      in: path
      description: Photo size
      required: true
      schema:
        $ref: '#/components/schemas/PhotoSize'
    precision:
      name: precision
      in: query
      description: Number of digits after the decimal point to include.
      schema:
        type: integer
        minimum: 0
    reportFormat:
      name: format
      in: query
      description: File format of the report.
      required: true
      schema:
        $ref: '#/components/schemas/ReportFormat'
    reportId:
      name: id
      in: path
      description: Report ID
      required: true
      schema:
        type: integer
        minimum: 1
    rowId:
      name: rowId
      in: path
      description: Row ID
      required: true
      schema:
        type: integer
        minimum: 1
    since:
      name: since
      in: query
      description: Get changes since a given date
      required: true
      schema:
        type: string
        format: date-time
    startDate:
      name: start
      in: query
      description: Start date of (inclusive) date range to include
      required: true
      schema:
        type: string
        format: date
    timeOffRequestAction:
      name: action
      in: query
      description: Limit to requests that the user has a particular level of access to.
      schema:
        $ref: '#/components/schemas/TimeOffRequestAction'
    timeOffRequestEmployeeId:
      name: employeeId
      in: query
      description: Limit response to a given employee ID
      schema:
        type: integer
        minimum: 1
    timeOffRequestId:
      name: id
      in: path
      description: Time off request ID
      required: true
      schema:
        type: integer
        minimum: 1
    timeOffRequestIdQuery:
      name: id
      in: query
      description: Limit response to a given time off request ID
      schema:
        type: integer
        minimum: 1
    timeOffRequestStatus:
      name: status
      in: query
      description: Time off request statuses to include
      schema:
        $ref: '#/components/schemas/TimeOffRequestStatus'
    timeOffType:
      name: type
      in: query
      description: Time off types to include
      schema:
        $ref: '#/components/schemas/TimeOffTypeId'
    timeOffTypesMode:
      name: mode
      in: query
      description: >-
        Set to "request" to get a list of all time off types with which this
        user can create a time off request. The default is to return the list
        of time off types the user has permissions on. This distinction is
        important, as employees can request time off for types that they don't
        have permission to view balances and requests for.
      schema:
        type: string
        enum:
        - request
    timeTrackingId:
      name: id
      in: path
      description: Time Tracking ID
      required: true
      schema:
        $ref: '#/components/schemas/TimeTrackingId'
    whoIsOutEndDate:
      name: end
      in: query
      description: >-
        End of the date range to consider.
        Defaults to 14 days from the start date.
      schema:
        type: string
        format: date
    whoIsOutStartDate:
      name: start
      in: query
      description: >-
        Start of the date range to consider.
        Defaults to current date.
      schema:
        type: string
        format: date


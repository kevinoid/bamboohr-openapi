  /v1/employees/{id}/time_off/history/:
    parameters:
    - $ref: '#/components/parameters/employeeId'
    put:
      tags:
      - TimeOff
      # Can't define multiple operations on same path in OAS3
      # https://github.com/OAI/OpenAPI-Specification/issues/182
      operationId: addHistoryEntryOrOverride
      summary: Add a time off history entry or override
      description: >-
        This operation is a combination of two operations with the same path:

        https://www.bamboohr.com/api/documentation/time_off.php#addHistoryOverride

        https://www.bamboohr.com/api/documentation/time_off.php#addHistoryEntry
      externalDocs:
        # Only one url is permitted in OAS3
        # https://github.com/OAI/OpenAPI-Specification/issues/1034
        # url: https://www.bamboohr.com/api/documentation/time_off.php#addHistoryOverride
        url: https://www.bamboohr.com/api/documentation/time_off.php#addHistoryEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTimeOffHistoryRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Success
          headers:
            location:
              description: API URL for the new time off request.
              schema:
                type: string
                format: url


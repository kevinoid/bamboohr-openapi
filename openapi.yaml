    Field:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/EmployeeFieldName'
        type:
          type: string
        name:
          type: string

    Employee:
      type: object
      properties:
        address1:
          description: The employee's first address line.
          type: string
          nullable: true
        address2:
          description: The employee's second address line.
          type: string
          nullable: true
        age:
          description: >-
            The employee's age. To change age, update dateOfBirth field.

            Has value -1 when dateOfBirth is unspecified.
          readOnly: true
          type: integer
          minimum: -1
        bestEmail:
          description: The employee's work email if set, otherwise their home email.
          readOnly: true
          type: string
          format: email
          nullable: true
        birthday:
          description: >-
            The employee's month and day of birth. To change birthday, update
            dateOfBirth field.

            Is empty string if dateOfBirth is unspecified.
          readOnly: true
          type: string
          pattern: '^([01][0-9]-[0-3][0-9])?$'
        city:
          description: The employee's city.
          type: string
          nullable: true
        country:
          description: The employee's country.
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Country'
        dateOfBirth:
          description: The date the employee was born.
          nullable: true
          type: string
          format: date
        department:
          description: The employee's CURRENT department.
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Department'
        division:
          description: The employee's CURRENT division.
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Division'
        eeo:
          description: The employee's EEO job category
          nullable: true
          allOf:
          - $ref: '#/components/schemas/EEOJobCategory'
        employeeNumber:
          description: Employee number (assigned by your company).
          nullable: true
          type: string
        employmentHistoryStatus:
          description: The employee's CURRENT employment status. Options are customized by account. Read-only starting with version 1.1; update using the employmentStatus table.
          nullable: true
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EmploymentStatus'
        ethnicity:
          description: The employee's ethnicity.
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Ethnicity'
        exempt:
          description: The employee's FLSA Overtime Status
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OvertimeExemptStatus'
        firstName:
          description: The employee's first name.
          nullable: true
          type: string
          minLength: 1
        flsaCode:
          description: The employee's FLSA Overtime Status
          deprecated: true
          x-deprecated:
            replaced-by: exempt
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OvertimeExemptStatus'
        fullName1:
          description: The employee's first and last name. (e.g., John Doe).
          readOnly: true
          type: string
          minLength: 1
        fullName2:
          description: The employee's last and first name. (e.g., Doe, John).
          readOnly: true
          type: string
          minLength: 1
        fullName3:
          description: The employee's full name and their preferred name. (e.g., Doe, John Quentin (JDog)).
          readOnly: true
          type: string
          minLength: 1
        fullName4:
          description: The employee's full name without their preferred name, last name first. (e.g., Doe, John Quentin).
          readOnly: true
          type: string
          minLength: 1
        fullName5:
          description: The employee's full name without their preferred name, first name first. (e.g., John Quentin Doe).
          readOnly: true
          type: string
          minLength: 1
        displayName:
          description: The employee's name displayed in a format configured by the user.
          readOnly: true
          type: string
          minLength: 1
        gender:
          description: The employee's gender.
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Gender'
        hireDate:
          description: The date the employee was hired.
          type: string
          format: date
        originalHireDate:
          description: The date the employee was originally hired. Available starting with version 1.1.
          type: string
          format: date
        homeEmail:
          description: The employee's home email address.
          nullable: true
          type: string
          format: email
        homePhone:
          description: The employee's home phone number.
          nullable: true
          type: string
        id:
          description: The employee ID automatically assigned by BambooHR.
          readOnly: true
          type: integer
          minimum: 1
        jobTitle:
          description: The CURRENT value of the employee's job title, updating this field will create a new row in position history.
          nullable: true
          allOf:
          - $ref: '#/components/schemas/JobTitle'
        lastChanged:

        note:
          type: string
      required:
      - status

    AddTimeOffHistoryRequest:
      description: >-
        Base type for addHistoryEntryOrOverride operation.
        **Do not use this class directly, use a subclass!**


        Should be abstract, since request must be a subtype:

        - https://github.com/OpenAPITools/openapi-generator/issues/3962

        - https://github.com/Azure/autorest/issues/995
      xml:
        name: history
      type: object
      discriminator:
        propertyName: eventType
        mapping:
          used: AddTimeOffHistoryEntryRequest
          override: AddTimeOffHistoryOverrideRequest
      properties:
        date:
          description: >-
            By convention, the date of the history entry should be the first
            date of the time off range.
          type: string
          format: date
        eventType:
          type: string
        note:
          description: Note attached to the history entry.
          type: string
      required:
      - date
      - eventType


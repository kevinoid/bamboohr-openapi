            type: integer
            minimum: 1
        required:
        - timeOffRequestId

    AddTimeOffHistoryOverrideRequest:
      allOf:
      - $ref: '#/components/schemas/AddTimeOffHistoryRequest'
      - type: object
        properties:
          timeOffTypeId:
            $ref: '#/components/schemas/TimeOffTypeId'
          amount:
            description: >-
              The number of days/hours of requested time off.
              The unit will be whatever the time off type is configured for.
            type: number
            format: decimal
            # Note: example amount in docs is -5

    AdjustTimeOffBalance:
      type: object
      properties:
        date:

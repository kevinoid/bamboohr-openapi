          format: integer
          readOnly: true
        date:
          type: string
          format: date
        location:
          $ref: '#/components/schemas/Location'
        division:
          description: The employee's CURRENT division.
          allOf:
          - $ref: '#/components/schemas/Division'
        department:
          description: The employee's CURRENT department.
          allOf:
          - $ref: '#/components/schemas/Department'
        jobTitle:
          $ref: '#/components/schemas/JobTitle'
        reportsTo:
          type: string
      required:
      - id
      - employeeId
      - date
      - location
      - division
      - department
      - jobTitle
      - reportsTo

    TimeOffPolicyType:
      type: string
      enum:
      - accruing
      - discretionary
      - manual

    TimeOffRequestAction:
      type: string
      enum:
      - approve
      - view

    TimeOffUnit:
      type: string
      enum:
      - days
      - hours

    TimeOffActions:
      type: object
      properties:
        view:
          type: boolean
        edit:
          type: boolean
        cancel:
          type: boolean
        approve:
          type: boolean
        deny:
          type: boolean
        bypass:
          type: boolean
      required:
      - view
      - edit
      - cancel
      - approve
      - deny
      - bypass

    TimeOffAmount:
      xml:
        name: amount
      type: object
      properties:
        unit:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/TimeOffUnit'
        amount:
          type: string
          format: integer
      required:
      - unit
      - amount

    TimeOffIcon:
      type: string
      enum:
      - airplane
      - baby-carriage
      - band-aid
      - birthday-cake
      - camping-trailer
      - family
      - first-aid-kit
      - gavel
      - graduation
      - happy-calendar
      - home
      - joining-hands
      - medal
      - palm-trees
      - selfie
      - teddy-bear
      - time-off-calendar
      - time-off-luggage

    TimeOffNotes:
      description: >-
        Earliest note made on a time off request by the employee and manager.
        If either has made multiple notes, only the first is returned.
      type: object
      properties:
        employee:
          type: string
        manager:
          type: string

    TimeOffType:
      description: >-
        Time off types defined in the Metadata API
        https://www.bamboohr.com/api/documentation/metadata.php#timeOffTypes
      type: string
      enum:
      - 1
      - 3
      x-enum-descriptions:
      - PTO
      - Leave Without Pay

    TimeOffTypeInfo:
      xml:
        name: type
      type: object
      properties:
        id:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/TimeOffType'
        name:
          type: string
        icon:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/TimeOffIcon'
      required:
      - id
      - name
      - icon

    TimeOffTypeInfoDetailed:
      allOf:
      - $ref: '#/components/schemas/TimeOffTypeInfo'
      - xml:
          name: timeOffType
        type: object
        properties:
          units:
            $ref: '#/components/schemas/TimeOffUnit'
          color:
            type: string
            pattern: '^[0-9a-f]{6}$'
        required:
        - units
        - color

    TimeOffTypes:
      xml:
        name: timeOffTypes
      type: object
      properties:
        timeOffTypes:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffTypeInfoDetailed'
        defaultHours:
          type: array
          items:
            $ref: '#/components/schemas/TableMetadata'

    TimeOffPolicy:
      xml:
        name: timeOffPolicy
      type: object
      properties:
        id:
          xml:
            attribute: true
          type: integer
          minimum: 1
        timeOffTypeId:
          $ref: '#/components/schemas/TimeOffType'
        name:
          type: string
        effectiveDate:
          type: string
          format: date
          nullable: true
        type:
          $ref: '#/components/schemas/TimeOffPolicyType'
      required:
      - id
      - timeOffTypeId
      - name
      - effectiveDate
      - type

    TimeOffPolicies:
      xml:
        name: timeOffPolicies
        wrapped: true
      type: array
      items:
        $ref: '#/components/schemas/TimeOffPolicy'

    TimeOffRequestStatus:
      type: string
      enum:
      - approved
      - canceled
      - declined
      - denied
      - requested
      - superceded

    TimeOffRequestStatusLastChanged:
      xml:
        name: status
      type: object
      properties:
        lastChanged:
          xml:
            attribute: true
          type: string
          format: date
        lastChangedByUserId:
          xml:
            attribute: true
          type: string
          format: integer
        status:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/TimeOffRequestStatus'
      required:
      - lastChanged
      - lastChangedByUserId
      - status

    TimeOffRequest:
      xml:
        name: request
      type: object
      properties:
        id:
          type: string
          format: integer
        employeeId:
          type: string
          format: integer
        status:
          $ref: '#/components/schemas/TimeOffRequestStatusLastChanged'
        name:
          type: string
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        created:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/TimeOffTypeInfo'
        amount:
          $ref: '#/components/schemas/TimeOffAmount'
        actions:
          $ref: '#/components/schemas/TimeOffActions'
        dates:
          description: >-
            Maps ISO date string to number of time-off hours requested.
          type: object
          # https://github.com/OAI/OpenAPI-Specification/issues/687
          # patternProperties:
          #   '^[0-9]{4}-[0-2]{2}-[0-2]{2}$':
          #     type: string
          #     format: integer
          additionalProperties:
            type: string
            format: integer
        notes:
          # FIXME: This is an empty array when there are no notes
          # TODO: Uncomment once OpenAPI Generator or Autorest support anyOf
          # https://github.com/OpenAPITools/openapi-generator/issues/15
          # anyOf:
          # - $ref: '#/components/schemas/TimeOffNotes'
          # - type: array
          #   items:
          #     $ref: '#/components/schemas/TimeOffNotes'
          $ref: '#/components/schemas/TimeOffNotes'
      required:
      - id
      - employeeId
      - status
      - name
      - start
      - end
      - created
      - type
      - amount

    TimeOffRequests:
      xml:
        name: requests
        wrapped: true
      type: array
      items:
        $ref: '#/components/schemas/TimeOffRequest'

    AddTimeOffRequest:
      xml:
        name: request
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TimeOffRequestStatus'
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        timeOffTypeId:
          $ref: '#/components/schemas/TimeOffType'
        amount:
          description: >-
            The number of days/hours to update the employee's balance by.
            The unit will be whatever the time off type is configured for.
          type: number
          minimum: 0
          exclusiveMinimum: true
        notes:
          $ref: '#/components/schemas/TimeOffNotes'
        dates:
          description: >-
            The <dates></dates> section is optional. If you don't provide it
            then all of the time off for the request will be deducted on the
            first day of the request.


            If you do provide details for the dates, then the amount
            for the overall request is ignored and the total amount of
            time requested is simply the sum of the amounts for each day.


            Keys are ISO date strings, values are number of hours requested.
          type: object
          # https://github.com/OAI/OpenAPI-Specification/issues/687
          # patternProperties:
          #   '^[0-9]{4}-[0-2]{2}-[0-2]{2}$':
          #     type: string
          #     format: integer
          additionalProperties:
            type: string
            format: integer
        previousRequest:
          description: >-
            If you supply the "previousRequest" parameter with a valid "time
            off request ID" then the original request will be canceled and the
            new request will be marked as its successor. This allows you to
            change a request that has already been approved. A request can be
            changed any time before the start date of the time off. The new
            request must list the same employee ID as the original request.
          type: integer
          minimum: 1

    UpdateTimeOffRequestStatusRequest:
      xml:
        name: request
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TimeOffRequestStatus'
        note:
          type: string
      required:
      - status

    AddTimeOffHistoryRequest:
      description: >-
        Base type for addHistoryEntryOrOverride operation.
        **Do not use this class directly, use a subclass!**


        Should be abstract, since request must be a subtype:

        - https://github.com/OpenAPITools/openapi-generator/issues/3962

        - https://github.com/Azure/autorest/issues/995
      xml:
        name: history
      type: object
      discriminator:
        propertyName: eventType
        mapping:
          used: AddTimeOffHistoryEntryRequest
          override: AddTimeOffHistoryOverrideRequest
      properties:
        date:
          description: >-
            By convention, the date of the history entry should be the first
            date of the time off range.
          type: string
          format: date
        eventType:
          type: string
        note:
          description: Note attached to the history entry.
          type: string
      required:
      - date
      - eventType

    AddTimeOffHistoryEntryRequest:
      allOf:
      - $ref: '#/components/schemas/AddTimeOffHistoryRequest'
      - type: object
        properties:
          timeOffRequestId:
            description: Time off request this history entry is linked to.
            type: integer
            minimum: 1
        required:
        - timeOffRequestId

    AddTimeOffHistoryOverrideRequest:
      allOf:
      - $ref: '#/components/schemas/AddTimeOffHistoryRequest'
      - type: object
        properties:
          timeOffTypeId:
            $ref: '#/components/schemas/TimeOffType'
          amount:
            description: >-
              The number of days/hours of requested time off.
              The unit will be whatever the time off type is configured for.
            type: number
            # Note: example amount in docs is -5

    EmployeeTimeOffPolicy:
      type: object
      properties:
        timeOffPolicyId:
          type: integer
          minimum: 1
        timeOffTypeId:
          $ref: '#/components/schemas/TimeOffType'
        accrualStartDate:
          description: >-
            Date on which this policy starts.  null removes the assignment.
          type: string
          format: date
          nullable: true
      required:
      - timeOffPolicyId
      - timeOffTypeId
      - accrualStartDate

    TimeOffEstimate:
      xml:
        name: estimate
      type: object
      properties:
        timeOffType:
          xml:
            attribute: true
          type: string
          format: integer
        name:
          xml:
            attribute: true
          type: string
        units:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/TimeOffUnit'
        balance:
          xml:
            attribute: true
          type: string
          format: decimal
          # Note: example in docs is -2.5 so negative is allowed
        policyType:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/TimeOffPolicyType'
        usedYearToDate:
          xml:
            attribute: true
          type: string
          format: decimal
        end:
          xml:
            attribute: true
          type: string
          format: date
      required:
      - timeOffType
      - name
      - units
      - balance
      - policyType
      - usedYearToDate
      - end

    TimeOffEstimates:
      xml:
        name: estimates
        wrapped: true
      type: array
      items:
        $ref: '#/components/schemas/TimeOffEstimate'

    WhoIsOutType:
      type: string
      enum:
      - holiday
      - timeOff

    WhoIsOutEntry:
      xml:
        name: item
      type: object
      properties:
        id:
          description: Time off request ID
          type: integer
          minimum: 1
        type:
          $ref: '#/components/schemas/WhoIsOutType'
        employeeId:
          type: integer
          minimum: 1
        name:
          description: >-
            Holiday name if type is "holiday".

            Employee name if type is "timeOff".
          type: string
        start:
          type: string
          format: date
        end:
          type: string
          format: date
      required:
      - id
      - type
      - employeeId
      - name
      - start
      - end

    WhoIsOutCalendar:
      xml:
        name: calendar
        wrapped: true
      type: array
      items:
        $ref: '#/components/schemas/WhoIsOutEntry'

    FieldMetadata:
      xml:
        name: field
      type: object
      properties:
        id:
          xml:
            attribute: true
          # FIXME: API returns a mix of string and integer in same response.
          # TODO: Uncomment once OpenAPI Generator or Autorest support anyOf
          # https://github.com/OpenAPITools/openapi-generator/issues/15
          # anyOf:
          # - type: integer
          #   minimum: 1
          # - type: string
          #   format: decimal
          type: string
          format: decimal
        name:
          type: string
        type:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/EmployeeFieldType'
        alias:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/EmployeeFieldName'
      required:
      - id
      - name
      - type

    FieldsMetadata:
      xml:
        name: fields
        wrapped: true
      type: array
      items:
        $ref: '#/components/schemas/FieldMetadata'

    ListOption:
      xml:
        name: option
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        archived:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/YesNo'
        createdDate:
          type: string
          format: date-time
        archivedDate:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
      required:
      - id
      - archived
      - createdDate
      - archivedDate
      - name

    ListOptions:
      xml:
        name: options
        wrapped: true
      type: array
      items:
        $ref: '#/components/schemas/ListOption'

    ListOptionUpdate:
      xml:
        name: options
      type: object
      properties:
        id:
          xml:
            attribute: true
          type: integer
          minimum: 1
        archived:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/YesNo'
        value:
          type: string
      required:
      - value

    ListOptionsUpdate:
      xml:
        name: options
      type: object
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/ListOptionUpdate'
      required:
      - options

    ListMetadata:
      xml:
        name: list
      type: object
      properties:
        fieldId:
          xml:
            attribute: true
          type: integer
          minimum: 1
        manageable:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/YesNo'
        multiple:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/YesNo'
        name:
          type: string
        options:
          $ref: '#/components/schemas/ListOptions'
        alias:
          xml:
            attribute: true
          allOf:
          - $ref: '#/components/schemas/EmployeeFieldName'

    ListsMetadata:
      xml:
        name: lists
        wrapped: true
      type: array
      items:
        $ref: '#/components/schemas/ListMetadata'

    TableAlias:
      type: string
      enum:
      - benefit_class
      - bonus
      - commission
      - compensation
      - contacts
      - customAssets
      - customDirectDepositInformation
      - customDriver'sLicenseInformation
      - dependents
      - earnings
      - emergencyContacts
      - employeeEducation
      - employeePassports
      - employeeVisas
      - employmentStatus
      - jobInfo

    TableMetadata:
      xml:
        name: table
      type: object
      properties:
        alias:
          $ref: '#/components/schemas/TableAlias'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldMetadata'
      required:
      - alias
      - fields

    TablesMetadata:
      xml:
        name: tables
        wrapped: true
      type: array
      items:
        $ref: '#/components/schemas/TableMetadata'

    UserStatus:
      type: string
      enum:
      - enabled

    User:
      xml:
        name: user
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        employeeId:
          description: 0 if user is not linked to an employee
          type: integer
          minimum: 0
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/UserStatus'
        lastLogin:
          type: string
          format: date-time
      required:
      - id
      - employeeId
      - firstName
      - lastName
      - email
      - status

    Users:
      xml:
        name: users
      type: object
      additionalProperties:
        $ref: '#/components/schemas/User'

    EmployeeChange:
      xml:
        name: employee
      type: object
      properties:
        id:
          type: string
          format: integer
        action:
          $ref: '#/components/schemas/ChangeType'
        lastChanged:
          type: string
          format: date-time
      required:
      - id
      - action
      - lastChanged

    ChangeList:
      xml:
        name: changeList
      type: object
      properties:
        latest:
          type: string
          format: date-time
        employees:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EmployeeChange'
      required:
      - latest
      - employees

    LoginRequest:
      type: object
      properties:
        user:
          description: The user's email address.
          type: string
          format: email
        password:
          description: The user's password.
          type: string
          format: password
        applicationKey:
          description: The application key provided to you by BambooHR.
          type: string
        deviceId:
          description: >-
            An ID for the user's mobile device. This deviceId can be generated
            when the app is first installed on a device, and should be unique
            enough to prevent collisions between users within the same company.
          type: string
      required:
      - user
      - password
      - applicationKey

    AuthResponse:
      xml:
        name: auth
      type: object
      properties:
        success:
          type: boolean
        userId:
          type: integer
          minimum: 1
        employeeId:
          type: integer
          minimum: 1
        key:
          type: string
      required:
      - userId
      - key

  responses:
    Error:
      description: Error
      headers:
        x-bamboohr-error-message:
          description: Error message
          schema:
            type: string
      x-ms-error-response: true

    ReportResponse:
      description: Successfully generated report
      content:
        application/json:
          schema:
            description: JSON report content
            type: string
            format: binary
        application/pdf:
          schema:
            description: PDF report content
            type: string
            format: binary
        application/vnd.ms-excel:
          schema:
            description: XLS report content
            type: string
            format: binary
        text/csv:
          schema:
            description: Unused type for CSV report content
            type: string
            format: binary
        text/plain:
          schema:
            description: Currently used type for CSV report content
            type: string
            format: binary
        text/xml:
          schema:
            description: XML report content
            type: string
            format: binary

paths:
  /v1/employees/:
    post:
      tags:
      - Employees
      operationId: addEmployee
      summary: Add an employee
      externalDocs:
        url: https://www.bamboohr.com/api/documentation/employees.php#addEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEmployeeRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Success
          headers:
            location:
              description: API URL for the new employee.
              schema:
                type: string
                format: url

  /v1/employees/directory:
    get:
      tags:
      - Employees
      operationId: getDirectory
      summary: Get a directory of employees
      externalDocs:
        url: https://www.bamboohr.com/api/documentation/employees.php#getEmployeeDirectory
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDirectory'
        '403':
          description: The directory has not been shared company-wide.
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true

  /v1/employees/{id}:
    parameters:
    - $ref: '#/components/parameters/employeeId'
    get:
      tags:
      - Employees
      operationId: getEmployee
      summary: Get employee
      externalDocs:
        url: https://www.bamboohr.com/api/documentation/employees.php#getEmployee
      parameters:
      - $ref: '#/components/parameters/employeeFields'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '403':
          description: User does not have permission to view employee
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true
        '404':
          description: Employee not found
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true
    post:
      tags:
      - Employees
      operationId: updateEmployee
      summary: Update employee
      externalDocs:
        url: https://www.bamboohr.com/api/documentation/employees.php#updateEmployee
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '403':
          description: User does not have permission to update ANY of the requested fields
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true
        '404':
          description: Employee not found
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true

  /v1/employees/{id}/files/:
    parameters:
    - $ref: '#/components/parameters/employeeId'
    post:
      tags:
      - Employees
      operationId: uploadEmployeeFile
      summary: Upload an employee file
      externalDocs:
        url: https://www.bamboohr.com/api/documentation/employees.php#uploadEmployeeFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFileRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Success
        '404':
          description: The employee ID was not found.
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true
        '413':
          description: The file size exceeds 20MB or the storage limit for the company.
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true
        '415':
          description: The file format is not supported or the width doesn't match the height.
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true

  /v1/employees/{id}/files/categories/:
    parameters:
    - $ref: '#/components/parameters/employeeId'
    post:
      tags:
      - Employees
      operationId: addEmployeeFileCategory
      summary: Add an employee file category
      externalDocs:
        url: https://www.bamboohr.com/api/documentation/employees.php#addEmployeeCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEmployeeFileCategoryRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Success
        '403':
          description: User does not have permission to see the requested employee or the employee's files.
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true
        '404':
          description: No files are found for the requested employee.
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true


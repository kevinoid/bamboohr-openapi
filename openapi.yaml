            https://mycompany.bamboohr.com, then the subdomain is "mycompany")
    get:
      tags:
      - Photos
      operationId: downloadEmployeePhotoByHash
      summary: Get an employee photo by email hash
      description: >-
        The image size is medium (170x170).


        Response Content-Type header is always image/jpeg, but the actual
        response content type matches the uploaded format, which may not be
        JPEG.
      externalDocs:
        url: https://www.bamboohr.com/api/documentation/photos.php#useBambooServer
      security: []
      parameters:
      - $ref: '#/components/parameters/hashedEmail'
      responses:
        default:

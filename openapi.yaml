        stateWithholding:
          type: string
          format: integer
        localWithholding:
          type: string
          format: integer
        additionalFed:
          type: string
          format: integer
        additionalState:
          type: string
          format: integer
        additionalLocal:
          type: string
          format: integer
        taxState:
          $ref: '#/components/schemas/StateCode'
        taxLocal:
          type: string

    EmployeeWithholdings:
      type: object
      properties:
        Employee Withholdings:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeWithholding'
      required:
      - Employee Withholdings

    EmployeeDirectDepositAccount:
      type: object
      properties:
        id:
          type: string
          format: integer
          minimum: 1
        employeeId:
          type: string
          format: integer
          minimum: 1
        accountType:
          $ref: '#/components/schemas/AccountType'
        maskedAccountNumber:
          type: string
          pattern: '^X-[0-9]{4}$'
        bankName:
          type: string
        depositOrder:
          type: string
          format: integer
          minimum: 0
        ruleType:
          $ref: '#/components/schemas/DirectDepositRuleType'
        ruleAmount:
          type: string
          format: decimal
          nullable: true
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - employeeId
      - accountType
      - maskedAccountNumber
      - bankName
      - depositOrder
      - ruleType
      - ruleAmount
      - createdAt
      - updatedAt

    EmployeeDirectDepositAccounts:
      type: object
      properties:
        Employee Id:
          type: string
          format: integer
        Employee Name:
          type: string
        Employee Direct Deposit Accounts:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeDirectDepositAccount'
      required:
      - Employee Id
      - Employee Name
      - Employee Direct Deposit Accounts

    EmployeePayStubDeduction:
      type: object
      properties:
        externalDeductionId:
          type: string
        deductionDescription:
          type: string
        deductionAmount:
          type: string
          format: decimal
          minimum: 0
        ytdDeductionAmount:
          type: string
          format: decimal
          minimum: 0
      required:
      - externalDeductionId
      - deductionDescription
      - deductionAmount
      - ytdDeductionAmount

    EmployeePayStubDeposit:
      type: object
      properties:
        depositOrder:
          type: string
          format: integer
          minimum: 0
        depositAmount:
          type: string
          format: decimal
          minimum: 0
        maskedAccountNumber:
          type: string
          pattern: '^X-[0-9]{4}$'
        accountType:
          $ref: '#/components/schemas/AccountType'
      required:
      - depositOrder
      - depositAmount
      - maskedAccountNumber
      - accountType

    EmployeePayStubTax:
      type: object
      properties:
        externalTaxId:
          type: string
        taxDescription:
          type: string
        taxAmount:
          type: string
          format: decimal
          minimum: 0
        ytdTaxAmount:
          type: string
          format: decimal
          minimum: 0
      required:
      - externalTaxId
      - taxDescription
      - taxAmount
      - ytdTaxAmount

    EmployeePayStubWage:
      type: object
      properties:
        externalWageId:
          type: string
        wageDescription:
          type: string
        wageAmount:
          type: string
          format: decimal
          minimum: 0
        ytdWageAmount:
          type: string
          format: decimal
          minimum: 0
        wageRate:
          type: string
          nullable: true
          format: decimal
          minimum: 0
        hours:
          type: string
          nullable: true
          format: decimal
          minimum: 0
      required:
      - externalWageId
      - wageDescription
      - wageAmount
      - ytdWageAmount
      - wageRate
      - hours

    EmployeePayStub:
      allOf:
      - $ref: '#/components/schemas/EmployeeWithholding'
      - type: object
        properties:
          recordId:
            type: string
            format: integer
            minimum: 1
            readOnly: true
          employeeId:
            type: string
            format: integer
            minimum: 1
          externalRecordId:
            type: string
            minLength: 1
          payPeriodFrom:
            type: string
            format: date
          payPeriodTo:
            type: string
            format: date
          payDate:
            type: string
            format: date
          payorName:
            type: string
            minLength: 1
          payorAdd1:
            type: string
            minLength: 1
          payorAdd2:
            type: string
          payorCity:
            type: string
            minLength: 1
          payorState:
            $ref: '#/components/schemas/StateCode'
          payorZip:
            type: string
            minLength: 1
          payeeName:
            type: string
            minLength: 1
          currencyCode:
            $ref: '#/components/schemas/CurrencyCode'
          net:
            type: string
            format: decimal
            minimum: 0
          gross:
            type: string
            format: decimal
            minimum: 0
          totalTaxes:
            type: string
            format: decimal
            minimum: 0
          totalDeductions:
            type: string
            format: decimal
            minimum: 0
          ytdNet:
            type: string
            format: decimal
            minimum: 0
          ytdGross:
            type: string
            format: decimal
            minimum: 0
          ytdTaxes:
            type: string
            format: decimal
            minimum: 0
          ytdDeductions:
            type: string
            format: decimal
            minimum: 0
          wages:
            type: array
            items:
              $ref: '#/components/schemas/EmployeePayStubWage'
          taxes:
            type: array
            items:
              $ref: '#/components/schemas/EmployeePayStubTax'
          deductions:
            type: array
            items:
              $ref: '#/components/schemas/EmployeePayStubDeduction'
          deposits:
            $ref: '#/components/schemas/EmployeePayStubDeposit'
        required:
        - employeeId
        - externalRecordId
        - payPeriodFrom
        - payPeriodTo
        - payDate
        - payorName
        - payorAdd1
        - payorCity
        - payorState
        - payorZip
        - payeeName
        - currencyCode
        - net
        - gross
        - totalTaxes
        - totalDeductions
        - ytdNet
        - ytdGross
        - ytdTaxes
        - ytdDeductions
        - fedWithholding
        - stateWithholding
        - localWithholding
        - additionalFed
        - additionalState
        - additionalLocal
        - taxState
        - taxLocal
        - wages
        - taxes
        - deductions
        - deposits

    EmployeeUnpaidPayStub:
      type: object
      properties:
        payDate:
          type: string
          format: date
      required:
      - payDate

    EmployeeUnpaidPayStubs:
      type: object
      properties:
        employeeId:
          type: integer
          minimum: 1
        unpaidPeriods:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeUnpaidPayStub'
      required:
      - employeeId
      - unpaidPeriods

    TimeTrackingId:
      type: string
      minLength: 1
      maxLength: 36

    TimeTrackingIdHolder:
      type: object
      properties:
        timeTrackingId:
          $ref: '#/components/schemas/TimeTrackingId'
      required:
      - timeTrackingId

    TimeTrackingRecord:
      allOf:
      - $ref: '#/components/schemas/TimeTrackingIdHolder'
      - type: object
        properties:
          employeeId:
            type: string
            format: integer
            minimum: 1
          divisionId:
            type: string
            format: integer
            minimum: 1
          departmentId:
            type: string
            format: integer
            minimum: 1
          jobTitleId:
            type: string
            format: integer
            minimum: 1
          payCode:
            type: string
          dateHoursWorked:
            type: string
            format: date
          type:
            # FIXME: What values can this have, and what is the meaning?
            type: string
            minLength: 1
            maxLength: 1
            readOnly: true
          payRate:
            type: string
            format: decimal
            minimum: 0
          rateType:
            $ref: '#/components/schemas/TimeTrackingRateType'
          hoursWorked:
            type: string
            format: decimal
            minimum: 0
          adjustedHours:
            type: string
            format: decimal
            readOnly: true
          jobData:
            description: >-
              A list of up to four 20 characters max job numbers in comma
              delimited format with no spaces
            type: string
            pattern: '^[^ ]{,20}(,[^ ]{,20}){,3}$'
        required:
        - hoursWorked
        # Required by addRequest:
        # - employeeId
        # - dateHoursWorked
        # - rateType

    TimeTrackingResultResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TimeTrackingId'
        message:
          type: string

    TimeTrackingResult:
      type: object
      properties:
        success:
          type: boolean
        response:
          $ref: '#/components/schemas/TimeTrackingResultResponse'
      required:
      - success
      - response

    Result:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
      - success
      - message

  responses:
    Error:
      description: Error
      headers:
        x-bamboohr-error-message:
          description: Error message
          schema:
            type: string
      x-ms-error-response: true

    ReportResponse:
      description: Successfully generated report
      content:
        application/json:
          schema:
            description: JSON report content
            type: string
            format: binary
        application/pdf:
          schema:
            description: PDF report content
            type: string
            format: binary
        application/vnd.ms-excel:
          schema:
            description: XLS report content
            type: string
            format: binary
        text/csv:
          schema:
            description: Unused type for CSV report content
            type: string
            format: binary
        text/plain:
          schema:
            description: Currently used type for CSV report content
            type: string
            format: binary
        text/xml:
          schema:
            description: XML report content
            type: string
            format: binary


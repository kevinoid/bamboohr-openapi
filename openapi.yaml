openapi: '3.0.2'

# API metadata
info:
  title: BambooHR API
  version: 1.0.0
  description: >-
    BambooHR provides companies a human capital management software as a
    service.
  contact:
    name: BambooHR
    email: support@bamboohr.com
    url: https://www.bamboohr.com/contact.php
    x-twitter: bamboohr
  termsOfService: https://www.bamboohr.com/terms-of-service/
  license:
    name: BambooHR API Terms of Use
    url: https://partners.bamboohr.com/bamboohr-api-terms-of-use/

  # APIs.guru Extensions
  # https://github.com/APIs-guru/openapi-directory/wiki/specification-extensions
  x-apiClientRegistration: https://www.bamboohr.com/signup/
  x-apisguru-categories:
  - enterprise
  x-description-language: en
  # More logos at https://www.bamboohr.com/about/press.php#mediaAssets
  x-logo:
    backgroundColor: '#FFFFFF'
    url: https://www.bamboohr.com/img/new-press-images/bamboohr-green-png.png
  x-unofficialSpec: true

externalDocs:
  description: BambooHR API Documentation
  url: https://documentation.bamboohr.com/docs

servers:
- url: https://api.bamboohr.com/api/gateway.php/{subdomain}
  variables:
    subdomain:
      default: mycompany
      description: >-
        The subdomain used to access your account (If you access BambooHR at
        https://mycompany.bamboohr.com, then the subdomain is "mycompany")

security:
- apiKey: []

tags:
- name: Changes
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/changes.php
- name: Employees
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/employees.php
- name: Login
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/login.php
- name: Metadata
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/metadata.php
- name: Photos
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/photos.php
- name: Tables
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/tables.php
- name: TimeOff
  externalDocs:
    url: https://www.bamboohr.com/api/documentation/time_off.php

components:
  securitySchemes:
    apiKey:
      description: >-
        Requests to the BambooHR API are authenticated by sending an "API Key"
        for the user to be authenticated as the HTTP Basic username.  The
        password is ignored, but is commonly shown as "x" in the documentation.


        See https://documentation.bamboohr.com/docs#section-authentication
      type: http
      scheme: basic

  parameters:
    changeType:
      name: type
      in: query
      description: Limit changes to a given type
      schema:
        $ref: '#/components/schemas/ChangeType'
    companyFileId:
      name: fileId
      in: path
      description: ID of a company file
      required: true
      schema:
        type: integer
        minimum: 1
    employeeFields:
      name: fields
      in: query
      description: Employee fields to return in the response.
      required: true
      explode: false
      schema:
        type: array
        items:
          type: string
    employeeFileId:
      name: fileId
      in: path
      description: ID of an employee file
      required: true
      schema:
        type: integer
        minimum: 1
    employeeId:
      name: id
      in: path
      description: Employee ID
      required: true
      schema:
        type: integer
        minimum: 1
    endDate:
      name: end
      in: query
      description: End date of (inclusive) date range to include
      required: true
      schema:
        type: string
        format: date
    fieldId:
      name: id
      in: path
      description: Field ID to update
      required: true
      schema:
        type: integer
        minimum: 1
    filterDuplicates:
      name: fd
      in: query
      description: Apply standard duplicate field filtering?  Default yes
      schema:
        $ref: '#/components/schemas/YesNo'
    hashedEmail:
      name: h
      in: query
      description: >-
        The hash of the employee's work email. If they don't have a work email
        then the hash of the home email will work. If they do have a work email
        then the home email will not work.


        The email address must be representable in ASCII.


        The hash is computed as the following md5(strtolower(trim($email))),
        where the trim() function eliminates ASCII whitespace, the strtolower()
        function converts ASCII text to lowercase and the md5 function produces
        a hex string representing the MD5 hash of the data. In PHP you can use
        these exact functions, in other languages there will be equivalent
        functions you can use.
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$'
    photoSize:
      name: size
      in: path
      description: Photo size
      required: true
      schema:
        $ref: '#/components/schemas/PhotoSize'
    precision:
      name: precision
      in: query
      description: Number of digits after the decimal point to include.
      schema:
        type: integer
        minimum: 0
    reportFormat:
      name: format
      in: query
      description: File format of the report.
      required: true
      schema:
        $ref: '#/components/schemas/ReportFormat'
    reportId:
      name: id
      in: path
      description: Report ID
      required: true
      schema:
        type: integer
        minimum: 1
    rowId:
      name: rowId
      in: path
      description: Row ID
      required: true
      schema:
        type: integer
        minimum: 1
    since:
      name: since
      in: query
      description: Get changes since a given date
      required: true
      schema:
        type: string
        format: date-time
    startDate:
      name: start
      in: query
      description: Start date of (inclusive) date range to include
      required: true
      schema:
        type: string
        format: date
    timeOffRequestAction:
      name: action
      in: query
      description: Limit to requests that the user has a particular level of access to.
      schema:
        $ref: '#/components/schemas/TimeOffRequestAction'
    timeOffRequestEmployeeId:
      name: employeeId
      in: query
      description: Limit response to a given employee ID
      schema:
        type: integer
        minimum: 1
    timeOffRequestId:
      name: id
      in: path
      description: Time off request ID
      required: true
      schema:
        type: integer
        minimum: 1
    timeOffRequestIdQuery:
      name: id
      in: query
      description: Limit response to a given time off request ID
      schema:
        type: integer
        minimum: 1
    timeOffRequestStatus:
      name: status
      in: query
      description: Time off request statuses to include
      schema:
        $ref: '#/components/schemas/TimeOffRequestStatus'
    timeOffType:
      name: type
      in: query
      description: Time off types to include
      schema:
        $ref: '#/components/schemas/TimeOffType'
    timeOffTypesMode:
      name: mode
      in: query
      description: >-
        Set to "request" to get a list of all time off types with which this
        user can create a time off request. The default is to return the list
        of time off types the user has permissions on. This distinction is
        important, as employees can request time off for types that they don't
        have permission to view balances and requests for.
      schema:
        type: string
        enum:
        - request
    whoIsOutEndDate:
      name: end
      in: query
      description: >-
        End of the date range to consider.
        Defaults to 14 days from the start date.
      schema:
        type: string
        format: date
    whoIsOutStartDate:
      name: start
      in: query
      description: >-
        Start of the date range to consider.
        Defaults to current date.
      schema:
        type: string
        format: date

  schemas:
    YesNo:
      type: string
      enum:
      - "yes"
      - "no"

    YesNoNonAssessment:
      type: string
      enum:

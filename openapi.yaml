      description: >-
        The response will be limited to those employees and time off types that
        the owner of the API key used to make the request has view access to.


        When using start and/or end dates the time off will show up if any day
        in the time off request falls within the dates specified, even if part
        of time off falls outside of the time specified.


        Clients should be ready for any number of "note" elements.


        If there are zero notes for a request then the "notes" tag will not be
        included in the response.


        Newer time off requests may also include details for each day of the
        request in a <dates> element.

      - $ref: '#/components/parameters/employeeId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadPhotoRequest'
            encoding:
              file:
                contentType: >-
                  image/bmp,
                  image/gif,
                  image/jpeg,
                  image/png,
                  image/tiff
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Success
        '404':
          description: The employee ID was not found.
          headers:

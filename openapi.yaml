    get:
      tags:
      - Employees
      operationId: getReport
      summary: Request a company report
      description: >-
        Use this resource to request one of your pre-existing company reports
        from the reporting section. You can get the report number by hovering
        over the report name on the reports page and grabbing the ID. At
        present, only reports from the Company Reports section are supported.
        In the future we may implement reports from the Report Library section
        if there is enough demand for it. The report numbers used in this
        request are different in each company.
      externalDocs:
        url: https://www.bamboohr.com/api/documentation/employees.php#requestCompanyReport
      parameters:
      - $ref: '#/components/parameters/reportFormat'
      - $ref: '#/components/parameters/filterDuplicates'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Nonexistent report id
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string

  /reports/custom:
    post:
      tags:
      - Employees
      operationId: getCustomReport
      summary: Request a custom report
      description: >-
        Use this resource to request BambooHR generate a report. You must
        specify a type of either "PDF", "XLS", "CSV", "JSON", or "XML". You
        must specify a list of fields to show on the report. The list of fields
        is available here. The custom report will return employees regardless
        of their status, "Active" or "Inactive". This differs from the UI,
        which by default applies a quick filter to display only "Active"
        employees. 
      externalDocs:
        url: https://www.bamboohr.com/api/documentation/employees.php#requestCustomReport
      parameters:
      - $ref: '#/components/parameters/reportFormat'
      requestBody:

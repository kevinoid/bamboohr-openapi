          x-ms-error-response: true
        '413':
          description: The file size exceeds 20MB or the storage limit for the company.
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true
        '415':
          description: The file format is not supported or the width doesn't match the height.
          headers:
            x-bamboohr-error-message:
              description: Error message
              schema:
                type: string
          x-ms-error-response: true


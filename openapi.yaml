        start:
          type: string
          format: date
        end:
          type: string
          format: date
        timeOffTypeId:
          $ref: '#/components/schemas/TimeOffTypeId'
        amount:
          description: >-
            The number of days/hours to update the employee's balance by.
            The unit will be whatever the time off type is configured for.
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
        notes:
          $ref: '#/components/schemas/TimeOffNotes'
        dates:
          description: >-
            The <dates></dates> section is optional. If you don't provide it
            then all of the time off for the request will be deducted on the
            first day of the request.


            If you do provide details for the dates, then the amount
            for the overall request is ignored and the total amount of
            time requested is simply the sum of the amounts for each day.


            Keys are ISO date strings, values are number of hours requested.
          type: object
          # https://github.com/OAI/OpenAPI-Specification/issues/687
          # patternProperties:
          #   '^[0-9]{4}-[0-2]{2}-[0-2]{2}$':
          #     type: string
          #     format: integer
          additionalProperties:
            type: string
            format: integer
        previousRequest:
          description: >-
            If you supply the "previousRequest" parameter with a valid "time
            off request ID" then the original request will be canceled and the
            new request will be marked as its successor. This allows you to
            change a request that has already been approved. A request can be
            changed any time before the start date of the time off. The new
            request must list the same employee ID as the original request.
          type: integer
          minimum: 1

